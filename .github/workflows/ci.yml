name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Run diff-budget tests
        run: bash tests/test-auto-review-diff-budget.sh
      - name: Run registry-settings tests
        run: bash tests/test-auto-review-registry-settings.sh
      - name: Run harness-models tests
        run: bash tests/test-auto-review-harness-models.sh
      - name: Run credentials-isolation tests
        run: bash tests/test-auto-review-credentials-isolation.sh
      - name: Run daemon-tick tests
        run: bash tests/test-auto-review-daemon-tick.sh

  docker-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run reviewer isolation docker tests
        run: RUN_DOCKER_TESTS=1 bash tests/test-auto-review-reviewer-isolation-docker.sh

  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Scan the tree and the history
        env:
          SCAN_DENY: ${{ secrets.SCAN_DENY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$SCAN_DENY" ]; then
            printf '%s\n' "$SCAN_DENY" > "$RUNNER_TEMP/deny.txt"
            export SCAN_DENY_FILE="$RUNNER_TEMP/deny.txt"
          fi
          python3 scripts/scan.py --tree .
          base="$BASE_SHA"
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] && git rev-parse --verify "${base}^{commit}" >/dev/null 2>&1; then
            python3 scripts/scan.py --history --range "$base..HEAD"
          else
            python3 scripts/scan.py --history
          fi
